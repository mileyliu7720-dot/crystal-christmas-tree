<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crystal Christmas Tree</title>
    <script type="module" crossorigin src="/assets/index-BepYDeho.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DknaJ9_.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="color:red;padding:20px;">Error: ' + 
            (e.error ? e.error.message : e.message) + 
            '<br><br>Check browser console for details.</div>';
        }
      });
    </script>
  </body>
</html>
